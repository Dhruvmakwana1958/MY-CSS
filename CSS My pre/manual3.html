<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: white;
            margin: 0;
            padding: 0;
        }
        .container{
            box-sizing: border-box; 
            width: 80%;
            background-color: #cccccc;
            margin: 30px auto; 
            padding: 20px;
            border: 2px solid #999;
           
        }
        .header{
            background-color: #c0c0c0;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #bbb;
        }
        .footer{
            background-color: #c0c0c0;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #bbb;
        }
        .content{
            background-color: #dddddd;
            padding : 25px ;
            margin-bottom:10px;
            border:  1px solid #bbb;
            border-radius: 5px;
        }
        .slidebar{
            background-color: #bbbbbb;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">My Website header</div>
        <div class="content">This is the main contet area</div>
        <div class="slidebar">This is the sllidebar</div>
        <div class="footer">This is a footer</div>
    </div>
</body>
</html>
