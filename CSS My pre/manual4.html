<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Embed and Hover Effect</title>
  <style>
    /* CSS for positioning video */
    .video-container {
      width: 560px;
      height: 315px;
      margin: 50px auto; /* Center the video horizontally */
      border: 3px solid #333;
      margin: 0px;
    }

    /* CSS for image hover effect */
    img:hover {
      background-color: yellow;
      border: 2px solid red;
      transition: 0.3s;
    }
  </style>
</head>
<body>

  <h2>Embedded Video</h2>
  <div class="video-container">
    <!-- Example YouTube embed code -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/bjxTIcuzB6k?si=K5r1Nrw52YWVptdj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <h2>Hover over the image</h2>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQ_2oII-AssPFNOvcLQ6ecJ6ZWQlUbKU3j8w&s" alt="Hover Image">

</body>
</html>
